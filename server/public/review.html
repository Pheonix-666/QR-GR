<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave a Google Review</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/review.css">
</head>
<body>
  <div class="page-container">
    <main class="review-card">
      <!-- Business Header -->
      <header class="brand-header">
        <div class="business-avatar" id="businessAvatar">
          <span id="businessInitial">★</span>
        </div>
        <div class="business-meta">
          <span class="category-badge" id="categoryBadge">Business Review</span>
          <h1 class="business-name" id="businessName">Loading...</h1>
        </div>
      </header>

      <!-- Google 5-Star Banner -->
      <div class="google-badge-banner">
        <div class="g-logo-wrap">
          <svg viewBox="0 0 48 48" width="24" height="24">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.79l7.97-6.2z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        </div>
        <div class="google-badge-text">
          <span class="badge-title">Google Customer Review</span>
          <div class="stars-visual">★★★★★</div>
        </div>
      </div>

      <!-- Suggested Review Box -->
      <section class="review-box-section">
        <div class="box-header">
          <label for="reviewTextArea" class="box-label">Your Review (Editable):</label>
          <button type="button" class="shuffle-btn" id="shuffleBtn" title="Get another review idea">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none">
              <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
            </svg>
            <span>Shuffle Idea</span>
          </button>
        </div>

        <div class="textarea-wrapper">
          <textarea 
            id="reviewTextArea" 
            rows="4" 
            placeholder="Type your review here or use our suggested template..."
          ></textarea>
        </div>
      </section>

      <!-- 1-Tap Copy & Open Button -->
      <section class="actions-section">
        <button type="button" class="primary-action-btn" id="proceedBtn">
          <div class="btn-content">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="proceedBtnText">Copy Text & Open Google Review</span>
          </div>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

        <!-- Simple 2-Step Instruction Hint -->
        <div class="steps-hint-box">
          <p><strong>How it works:</strong></p>
          <ol>
            <li>Tap the button above to copy this review & launch Google.</li>
            <li>Paste your review into Google's box and tap <strong>Post</strong>!</li>
          </ol>
        </div>
      </section>
    </main>

    <!-- Toast Notification -->
    <div class="toast-notification" id="copyToast">
      <div class="toast-icon">✅</div>
      <div class="toast-body">
        <strong>Review Copied!</strong>
        <span>Opening Google Reviews. Simply paste and tap Post!</span>
      </div>
    </div>
  </div>

  <script src="/js/review.js"></script>
</body>
</html>
